    <meta charset="utf-8">

    <meta property="og:site_name" content="badge.video">
    <meta property="og:title" content="badge.video">
    <meta property="og:description" content="Interactive map of U.S. police bodycam youtube videos.">

    <meta property="og:url" content="https://badge.video/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="badge.video">
    <meta name="twitter:description" content="Interactive map of U.S. police bodycam youtube videos.">

    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">badge.video</div>
          <h1>Interactive Bodycam Map</h1>
        </div>
        <div class="status">
          <a class="statusButton" href="https://github.com/zoogies/badge.video" target="_blank" rel="noopener noreferrer" title="Open GitHub repository" aria-label="Open GitHub repository">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.5 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.38-3.37-1.38-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.36 1.12 2.93.86.09-.67.35-1.12.63-1.38-2.22-.26-4.55-1.14-4.55-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.34 9.34 0 0 1 12 6.98c.85 0 1.7.12 2.5.35 1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.8-4.57 5.05.36.32.68.94.68 1.9 0 1.38-.01 2.49-.01 2.83 0 .28.18.6.69.5A10.13 10.13 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z"></path>
            </svg>
            <span>GitHub</span>
          </a>
          <button id="randomButton" class="statusButton" type="button" title="Select random video" aria-label="Select random video">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 3h5v5"></path>
              <path d="M4 20 21 3"></path>
              <path d="M21 16v5h-5"></path>
              <path d="M15 15 21 21"></path>
              <path d="M4 4l5 5"></path>
            </svg>
            <span>Random</span>
          </button>
          <span id="generatedAt">Loading data</span>
          <span id="recordCount">0 videos</span>
        </div>
      </header>

      <section class="filters" aria-label="Filters">
        <label>
          Search
          <input id="searchInput" type="search" placeholder="title, city, county, agency, crime">
        </label>
        <button id="mobileFilterButton" class="mobileFilterButton" type="button" aria-expanded="false" aria-controls="mobileFilterSheet">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16"></path>
            <path d="M7 12h10"></path>
            <path d="M10 18h4"></path>
          </svg>
          <span>Filters</span>
        </button>
        <div id="filterBackdrop" class="filterBackdrop hidden"></div>
        <div id="mobileFilterSheet" class="filterSheet" aria-label="Filter and sort options">
          <div class="filterSheetHeader">
            <button id="clearFiltersButton" class="ghostButton" type="button">Clear filters</button>
            <button id="filterCloseButton" class="filterCloseButton" type="button" aria-label="Close filters">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
              </svg>
            </button>
          </div>
          <label>
            State
            <select id="stateFilter"></select>
          </label>
          <label>
            County
            <select id="countyFilter"></select>
          </label>
          <label>
            Crime
            <select id="crimeFilter"></select>
          </label>
          <label>
            Channel
            <select id="channelFilter"></select>
          </label>
          <label>
            Review
            <select id="reviewFilter">
              <option value="">All</option>
              <option value="needs_review">Needs review</option>
              <option value="reviewed">Human reviewed</option>
            </select>
          </label>
          <label>
            Sort
            <select id="sortSelect">
              <option value="published_desc">Published newest</option>
              <option value="published_asc">Published oldest</option>
              <option value="state">State</option>
              <option value="crime">Crime</option>
              <option value="review">Review status</option>
              <option value="random">Random</option>
            </select>
          </label>
        </div>
      </section>

      <section class="workspace">
        <section class="mapPanel" aria-label="US state and county video volume">
          <div class="panelHeader">
            <div>
              <h2>US Map</h2>
              <p>Locations are AI-estimated. Please submit any corrections!</p>
            </div>
            <div class="mapTools">
              <select id="mapMode" aria-label="Map overlay mode">
                <option value="states">States</option>
                <option value="counties" selected>Counties</option>
              </select>
              <button id="resetViewButton" class="ghostButton" type="button" title="Reset map view">Reset view</button>
              <button id="clearMapButton" class="ghostButton" type="button" title="Clear selected state or county">Clear selection</button>
            </div>
          </div>
          <div class="mapCanvas">
            <svg id="mapSvg" role="img" aria-label="Interactive United States map">
              <g id="mapLayer">
                <g id="stateLayer"></g>
                <g id="countyLayer"></g>
              </g>
            </svg>
            <div id="mapTooltip" class="mapTooltip hidden"></div>
          </div>
        </section>

        <section class="resultsPanel" aria-label="Video results">
          <div class="panelHeader">
            <div>
              <h2>Videos</h2>
              <p id="resultSummary">No records loaded</p>
            </div>
          </div>
          <div id="videoList" class="videoList"></div>
        </section>

        <div id="detailBackdrop" class="detailBackdrop hidden"></div>
        <aside class="detailPanel" aria-label="Selected video">
          <div id="detailEmpty" class="emptyState">Select a video to inspect classification details.</div>
          <article id="detailContent" class="detailContent hidden"></article>
        </aside>
      </section>
    </main>
    <script src="./vendor/d3.v7.min.js"></script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
