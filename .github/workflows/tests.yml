name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  scrapers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Run scraper tests
        run: uv run pytest
