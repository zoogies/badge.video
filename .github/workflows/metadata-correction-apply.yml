name: Apply metadata correction

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    if: github.event.label.name == 'accepted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify labeler permission
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: |
          permission="$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)"
          case "$permission" in
            admin|maintain|write) echo "Accepted by $ACTOR with $permission permission." ;;
            *) echo "::error::Ignoring accepted label from $ACTOR with $permission permission."; exit 1 ;;
          esac

      - name: Write issue body
        run: |
          python -c "import json, pathlib; pathlib.Path('issue_body.md').write_text(json.load(open('${{ github.event_path }}'))['issue'].get('body') or '', encoding='utf-8')"

      - name: Validate correction payload
        run: |
          python scrapers/review_corrections.py validate \
            --issue-body issue_body.md \
            --output-json correction_summary.json \
            > validation.md

      - name: Apply correction
        run: |
          python scrapers/review_corrections.py apply \
            --issue-body issue_body.md \
            --output-json correction_summary.json

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          base_branch="$(python -c "import json; print(json.load(open('correction_summary.json'))['branch'])")"
          branch="$base_branch-$RUN_ID"
          title="$(python -c "import json; print(json.load(open('correction_summary.json'))['title'])")"
          data_path="$(python -c "import json; print(json.load(open('correction_summary.json'))['data_path'])")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$data_path"
          if git diff --cached --quiet; then
            gh issue comment "$ISSUE_NUMBER" --body "No file changes were produced after applying this correction."
            exit 0
          fi
          git commit -m "Apply metadata correction from #$ISSUE_NUMBER"
          git push --set-upstream origin "$branch"
          rm -f issue_body.md validation.md correction_summary.json
          pr_body="$(printf 'Applies the accepted metadata correction from #%s.\n\nCloses #%s.' "$ISSUE_NUMBER" "$ISSUE_NUMBER")"
          if pr_url="$(gh pr create \
            --title "$title" \
            --body "$pr_body" \
            --label "pr opened" \
            --reviewer "zoogies")"; then
            gh issue comment "$ISSUE_NUMBER" --body "Opened PR: $pr_url"
            gh issue edit "$ISSUE_NUMBER" --add-label "pr opened" || true
          else
            compare_url="https://github.com/$REPO/compare/main...$branch?quick_pull=1"
            gh issue comment "$ISSUE_NUMBER" --body "Pushed correction branch, but Actions is not currently permitted to create pull requests. Open it manually: $compare_url"
          fi
