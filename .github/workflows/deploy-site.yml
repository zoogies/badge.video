name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check database changes
        id: changed-files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "database_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -Eq '^(database/Videos/|database/channels\.json$)'; then
            echo "database_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "database_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build compact frontend data
        if: steps.changed-files.outputs.database_changed == 'true'
        run: python scrapers/build_frontend_data.py

      - name: Commit rebuilt atlas
        if: steps.changed-files.outputs.database_changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/metadata_atlas.json frontend/public/data/metadata_atlas.json
          if git diff --cached --quiet; then
            echo "No atlas changes to commit."
          else
            git commit -m "Rebuild metadata atlas [skip ci]"
            git push
          fi

      - name: Inject site commit metadata
        run: python -c "from pathlib import Path; path=Path('frontend/index.html'); text=path.read_text(encoding='utf-8'); path.write_text(text.replace('name=\"badge-video-commit\" content=\"\"', 'name=\"badge-video-commit\" content=\"${{ github.sha }}\"'), encoding='utf-8')"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
