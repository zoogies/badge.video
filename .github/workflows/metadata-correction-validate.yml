name: Validate metadata correction

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Write issue body
        run: |
          python -c "import json, pathlib; pathlib.Path('issue_body.md').write_text(json.load(open('${{ github.event_path }}'))['issue'].get('body') or '', encoding='utf-8')"

      - name: Load open correction issues
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue list --state open --label "requesting changes" --json number,body --limit 200 \
            | python -c "import json, os, sys; current=int(os.environ['ISSUE_NUMBER']); print(json.dumps([issue for issue in json.load(sys.stdin) if issue.get('number') != current]))" \
            > open_issues.json

      - name: Validate correction payload
        id: validate
        continue-on-error: true
        run: |
          python scrapers/review_corrections.py validate \
            --issue-body issue_body.md \
            --open-issues open_issues.json \
            --output-json correction_summary.json \
            > validation.md

      - name: Comment validation result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file validation.md

      - name: Update validation labels
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [[ "${{ steps.validate.outcome }}" == "success" ]]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "bot validated" --remove-label "bot invalidated" || true
            if grep -q "Duplicate of:" validation.md; then
              gh issue edit "$ISSUE_NUMBER" --add-label "duplicate" || true
            else
              gh issue edit "$ISSUE_NUMBER" --remove-label "duplicate" || true
            fi
            if grep -q "Conflicts with:" validation.md; then
              gh issue edit "$ISSUE_NUMBER" --add-label "conflict" || true
            else
              gh issue edit "$ISSUE_NUMBER" --remove-label "conflict" || true
            fi
          else
            gh issue edit "$ISSUE_NUMBER" --add-label "bot invalidated" --remove-label "bot validated" || true
          fi
